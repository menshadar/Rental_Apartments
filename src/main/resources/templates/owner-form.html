<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Квартира</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="container topbar-inner">
        <a class="brand" th:href="@{/apartments}">Оренда квартир</a>
        <nav>
            <a th:href="@{/apartments}">Пошук</a>
            <a class="active" th:href="@{/owner/apartments}">Кабінет хазяїна</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 th:text="${apartment.id == null} ? 'Нова квартира' : 'Редагування квартири'">Квартира</h1>

    <form class="panel" th:action="@{/owner/apartments}" th:object="${apartment}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-grid">
            <div class="field full">
                <label for="title">Назва</label>
                <input type="text" id="title" th:field="*{title}" required placeholder="Затишна однокімнатна">
            </div>

            <div class="field full">
                <label for="description">Опис</label>
                <textarea id="description" th:field="*{description}" placeholder="Коротко про квартиру"></textarea>
            </div>

            <div class="field">
                <label for="city">Місто</label>
                <input type="text" id="city" th:field="*{city}" required>
            </div>

            <div class="field">
                <label for="rooms">Кімнат</label>
                <input type="number" id="rooms" th:field="*{rooms}" min="1" max="10" step="1" required>
            </div>

            <div class="field">
                <label for="area">Площа</label>
                <div class="input-wrap">
                    <input type="number" id="area" th:field="*{area}" min="1" step="any" required>
                    <span class="unit">м²</span>
                </div>
            </div>

            <div class="field">
                <label for="price">Ціна</label>
                <div class="input-wrap">
                    <input type="number" id="price" th:field="*{price}" min="0" step="any" required>
                    <span class="unit">грн/міс</span>
                </div>
            </div>
        </div>

        <div class="actions" style="margin-top:22px">
            <button class="btn" type="submit">Зберегти</button>
            <a class="btn btn-secondary" th:href="@{/owner/apartments}">Скасувати</a>
        </div>
    </form>
</main>
</body>
</html>
