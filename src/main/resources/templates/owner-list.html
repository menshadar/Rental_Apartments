<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кабінет хазяїна</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="container topbar-inner">
        <a class="brand" th:href="@{/apartments}">Оренда квартир</a>
        <nav>
            <a th:href="@{/apartments}">Пошук</a>
            <a class="active" th:href="@{/owner/apartments}">Кабінет хазяїна</a>
        </nav>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <h1>Мої квартири</h1>
        <a class="btn" th:href="@{/owner/apartments/new}">+ Додати квартиру</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr><th>ID</th><th>Назва</th><th>Місто</th><th>Кімнат</th><th>Площа</th><th>Ціна</th><th>Дії</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${apartments}">
                <td th:text="${a.id}"></td>
                <td th:text="${a.title}"></td>
                <td th:text="${a.city}"></td>
                <td th:text="${a.rooms}"></td>
                <td th:text="${a.area} + ' м²'"></td>
                <td th:text="${@priceFormatter.format(a.price)}"></td>
                <td>
                    <div class="actions">
                        <a class="btn btn-secondary btn-small"
                           th:href="@{/owner/apartments/{id}/edit(id=${a.id})}">Редагувати</a>
                        <form th:action="@{/owner/apartments/{id}/delete(id=${a.id})}" method="post"
                              onsubmit="return confirm('Видалити цю квартиру?')">
                            <button class="btn btn-danger btn-small" type="submit">Видалити</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(apartments)}" style="margin-top:20px">
        Список порожній. Додайте першу квартиру.
    </div>
</main>
</body>
</html>
